# Models under test, per backend (subscription CLIs).
#
#   key        stable id used in result files and in the paper
#   label      name shown in the paper
#   cli_model  value passed to --model / -m of the CLI
#   effort     reasoning effort: for agy it is part of the model id; claude gets --effort,
#              codex gets -c model_reasoning_effort
#   pricing    key in config/pricing.toml used for the API cost estimate
#
# All models run at the same effort ("medium") so that the comparison is fair.

[agy]
plan = "Google AI Pro ($20/month)"   # subscription the quota figures refer to
binary = "agy"              # override with the AGY_BIN environment variable
workers = 3                 # parallel requests per model

[[agy.models]]
key = "gemini-4-neon"
label = "Gemini 4 Neon"
cli_model = "gemini-4-neon-medium"
effort = "medium"
pricing = "gemini-4-neon"

[[agy.models]]
key = "gemini-4-argon"
label = "Gemini 4 Argon"
cli_model = "gemini-4-argon-medium"
effort = "medium"
pricing = "gemini-4-argon"

[[agy.models]]
key = "gemini-4-hydrogen"
label = "Gemini 4 Hydrogen"
cli_model = "gemini-4-hydrogen-medium"
effort = "medium"
pricing = "gemini-4-hydrogen"

[[agy.models]]
key = "gemini-3.8-flash"
label = "Gemini 3.8 Flash"
cli_model = "gemini-3.8-flash-medium"
effort = "medium"
pricing = "gemini-3.8-flash"

[claude]
plan = "Claude Pro ($20/month)"   # subscription the quota figures refer to
binary = "claude"           # Claude Code; override with the CLAUDE_BIN environment variable
workers = 3

[[claude.models]]
key = "claude-opus-5-5"
label = "Claude Opus 5.5"
cli_model = "claude-opus-5-5"
effort = "medium"
pricing = "claude-opus-5-5"

[[claude.models]]
key = "claude-sonnet-5-5"
label = "Claude Sonnet 5.5"
cli_model = "claude-sonnet-5-5"
effort = "medium"
pricing = "claude-sonnet-5-5"

[[claude.models]]
key = "claude-haiku-5-5"
label = "Claude Haiku 5.5"
cli_model = "claude-haiku-5-5"
effort = "medium"
pricing = "claude-haiku-5-5"

[codex]
