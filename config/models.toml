# Modelli da valutare, per backend (CLI in modalità abbonamento).
#
#   key        identificativo stabile usato nei file di risultato e nel paper
#   label      nome mostrato nel paper
#   cli_model  valore passato a --model / -m della CLI
#   effort     livello di ragionamento (per agy è già nel nome del modello; per claude viene passato
#              come --effort, per codex come model_reasoning_effort)
#   pricing    chiave in config/pricing.toml per la stima del costo API

[agy]
binary = "agy"              # sovrascrivibile con la variabile d'ambiente AGY_BIN
workers = 3                 # richieste in parallelo per modello

[[agy.models]]
key = "gemini-4-neon"
label = "Gemini 4 Neon"
cli_model = "gemini-4-neon-high"
effort = "high"
pricing = "gemini-4-neon"

[[agy.models]]
key = "gemini-4-argon"
label = "Gemini 4 Argon"
cli_model = "gemini-4-argon-high"
effort = "high"
pricing = "gemini-4-argon"

[[agy.models]]
key = "gemini-4-hydrogen"
label = "Gemini 4 Hydrogen"
cli_model = "gemini-4-hydrogen-high"
effort = "high"
pricing = "gemini-4-hydrogen"

[claude]
binary = "claude"           # Claude Code; sovrascrivibile con la variabile d'ambiente CLAUDE_BIN
workers = 3

[[claude.models]]
key = "claude-opus-5-5"
label = "Claude Opus 5.5"
cli_model = "claude-opus-5-5"
effort = "high"
pricing = "claude-opus-5-5"

[[claude.models]]
key = "claude-sonnet-5-5"
label = "Claude Sonnet 5.5"
cli_model = "claude-sonnet-5-5"
effort = "high"
pricing = "claude-sonnet-5-5"

[[claude.models]]
key = "claude-haiku-5-5"
label = "Claude Haiku 5.5"
cli_model = "claude-haiku-5-5"
effort = "high"
pricing = "claude-haiku-5-5"

[codex]
binary = "codex"            # sovrascrivibile con la variabile d'ambiente CODEX_BIN
workers = 3

[[codex.models]]
key = "gpt-6.2-astra"
label = "GPT-6.2 Astra"
cli_model = "gpt-6.2-astra"
effort = "high"
pricing = "gpt-6.2-astra"

[[codex.models]]
key = "gpt-6.2-sol"
label = "GPT-6.2 Sol"
cli_model = "gpt-6.2-sol"
effort = "high"
